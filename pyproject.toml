[project]
name = "furniture-buyer-lab"
version = "0.1.0"
description = "A basic buyer-seller web app with placeholder products and order persistence."
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
flask = "^2.4"
flask-login = "^0.7"
flask-sqlalchemy = "^3.0"
email-validator = "^1.3"
pymongo = "^4.6"
python-dotenv = "^1.0"
requests = "^2.31"
openai = "^2.50"
pillow = "^12.3"

[project.scripts]
start = "python -m furniture_buyer_lab.app"
